<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPE File Manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-tile">KPE</span>
      <span class="brand-title">File Manager</span>
    </div>

    <div class="side-heading">Server</div>
    <nav class="side-nav">
      <button class="nav-tab active" id="navFiles" data-view="files">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 6a1 1 0 011-1h4l1.5 2H16a1 1 0 011 1v7a1 1 0 01-1 1H4a1 1 0 01-1-1V6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span>Files</span>
      </button>
      <button class="nav-tab" id="navConsole" data-view="console">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3.5" width="15" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8l2.5 2-2.5 2M10 12.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Console</span>
      </button>
    </nav>

    <div class="side-heading">Search</div>
    <div class="search-wrap" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M14 14L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Filter · Enter = search all" autocomplete="off">
    </div>

    <div class="sidebar-foot">
      <button id="logoutBtn" class="side-action" title="Log out">
        <svg viewBox="0 0 20 20" fill="none"><path d="M8 4H5a1 1 0 00-1 1v10a1 1 0 001 1h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 14l4-4-4-4M17 10H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div class="page-title">Server files</div>
      <div class="topbar-actions" id="topbarActions">
        <button id="newFolderBtn" class="btn btn-ghost">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 6a1 1 0 011-1h4l1.5 2H16a1 1 0 011 1v7a1 1 0 01-1 1H4a1 1 0 01-1-1V6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 10v3.5M8.25 11.75h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>New folder</span>
      </button>
        <button id="newFileBtn" class="btn btn-ghost">
        <svg viewBox="0 0 20 20" fill="none"><path d="M5 3h6l4 4v10a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 3v4h4" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 9.5v4M8 11.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>New file</span>
      </button>
        <label class="btn btn-primary file-upload-label">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 13V4M10 4L6.5 7.5M10 4l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14v1.5A1.5 1.5 0 005.5 17h9a1.5 1.5 0 001.5-1.5V14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Upload</span>
        <input type="file" id="uploadInput" hidden multiple>
      </label>
      </div>
    </header>

  <!-- ===================== Browser view ===================== -->
  <div id="browserView">
    <div class="subbar">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="subbar-right">
        <div id="itemCount" class="item-count"></div>
        <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh folder">
          <svg viewBox="0 0 20 20" fill="none"><path d="M16 10a6 6 0 10-1.76 4.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M16 6v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <div id="dropzone" class="dropzone hidden">
        <div class="dropzone-inner">
          <svg viewBox="0 0 48 48" fill="none"><path d="M24 30V10M24 10l-9 9M24 10l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 34v3a4 4 0 004 4h20a4 4 0 004-4v-3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <div>Drop to upload here</div>
        </div>
      </div>

      <div id="bulkBar" class="bulk-bar hidden">
        <span class="bulk-count" id="bulkCount">0 selected</span>
        <div class="bulk-actions">
          <button class="btn btn-ghost" id="bulkCompressBtn">
            <svg viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M9 3v2M11 5v2M9 7v2M11 9v2M9 11v2" stroke="currentColor" stroke-width="1.2"/><circle cx="10" cy="14" r="1.1" stroke="currentColor" stroke-width="1.1"/></svg>
            <span>Compress</span>
          </button>
          <button class="btn btn-ghost" id="bulkExtractBtn">
            <svg viewBox="0 0 20 20" fill="none"><rect x="3.5" y="8" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M10 3v7M10 3l-2.5 2.5M10 3l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Extract</span>
          </button>
          <button class="btn btn-ghost" id="bulkDownloadBtn">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v9M10 12l-3.5-3.5M10 12l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>Download</span>
          </button>
          <button class="btn btn-ghost" id="bulkRenameBtn">
            <svg viewBox="0 0 20 20" fill="none"><path d="M13.5 3.5l3 3L7 16H4v-3l9.5-9.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Rename</span>
          </button>
          <button class="btn btn-danger-solid" id="bulkDeleteBtn">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4.5 5.5h11M8 5.5v-1a1 1 0 011-1h2a1 1 0 011 1v1M8.5 9v5M11.5 9v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.5 5.5l.6 9.5a1 1 0 001 .9h5.8a1 1 0 001-.9l.6-9.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Delete</span>
          </button>
        </div>
        <button class="bulk-clear" id="bulkClearBtn" aria-label="Clear selection">&times;</button>
      </div>

      <table id="fileTable">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="selectAllCheckbox" aria-label="Select all"></th>
            <th class="col-icon"></th>
            <th class="col-name sortable" data-sort="name">Name <span class="sort-arrow"></span></th>
            <th class="col-size sortable" data-sort="size">Size <span class="sort-arrow"></span></th>
            <th class="col-modified sortable" data-sort="modified">Modified <span class="sort-arrow"></span></th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="fileTableBody"></tbody>
      </table>

      <div id="emptyState" class="empty-state hidden">
        <svg viewBox="0 0 64 64" fill="none"><path d="M10 20a3 3 0 013-3h10l4 5h24a3 3 0 013 3v25a3 3 0 01-3 3H13a3 3 0 01-3-3V20z" stroke="currentColor" stroke-width="2"/></svg>
        <div class="empty-title" id="emptyTitle">This folder is empty</div>
        <div class="empty-sub" id="emptySub">Upload a file or create a folder to get started.</div>
      </div>

      <div id="loadingState" class="loading-state hidden">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- ===================== Console view ===================== -->
  <div id="consoleView" class="console-view hidden">
    <div class="subbar">
      <div class="breadcrumb"><a class="current">Live console</a></div>
      <div class="item-count" id="consoleStatus">Connecting…</div>
    </div>

    <div class="console-wrap">
      <div class="console-log" id="consoleLog"></div>
      <form class="console-input-row" id="consoleForm">
        <span class="console-prompt">&raquo;</span>
        <input type="text" id="consoleInput" class="console-input" placeholder="Type a command and press Enter…" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn btn-save">Send</button>
      </form>
    </div>
  </div>

  <!-- ===================== Find-in-files results view ===================== -->
  <div id="searchView" class="search-view hidden">
    <div class="subbar">
      <div id="searchResultsTitle" class="search-title"></div>
      <div class="subbar-right">
        <button id="searchBackBtn" class="btn btn-ghost">Back to files</button>
      </div>
    </div>
    <div class="search-results-wrap">
      <ul id="searchResultsList" class="search-results"></ul>
    </div>
  </div>

  <!-- ===================== Full-page editor view ===================== -->
  <div id="editorView" class="editor-view hidden">
    <div class="subbar">
      <div id="editorBreadcrumb" class="breadcrumb"></div>
      <div id="editorLineCount" class="item-count">1 line</div>
    </div>

    <div id="findBar" class="find-bar hidden" role="search">
      <input type="text" id="findInput" placeholder="Find in file" autocomplete="off" spellcheck="false">
      <span id="findCount" class="find-count"></span>
      <button class="find-btn" id="findPrev" title="Previous (Shift+Enter)" aria-label="Previous match">&uarr;</button>
      <button class="find-btn" id="findNext" title="Next (Enter)" aria-label="Next match">&darr;</button>
      <button class="find-btn" id="findClose" title="Close (Esc)" aria-label="Close find">&times;</button>
    </div>

    <div class="editor-page-wrap">
      <div class="editor-body">
        <div class="editor-gutter" id="editorGutter"><div>1</div></div>
        <div class="editor-scroll">
          <pre class="editor-highlight" id="editorHighlight" aria-hidden="true"><code></code></pre>
          <div class="find-marks" id="findMarks" aria-hidden="true"><div class="find-marks-inner" id="findMarksInner"></div></div>
          <textarea id="editorTextarea" spellcheck="false" wrap="off"></textarea>
        </div>
      </div>
    </div>

    <div class="editor-bottom-bar">
      <div class="editor-lang-pill" id="editorLang">Text</div>
      <div class="editor-bottom-actions">
        <span class="modal-hint">⌘S / Ctrl+S</span>
        <button class="btn btn-ghost" id="editorCancel">Cancel</button>
        <button class="btn btn-save" id="editorSave">Save content</button>
      </div>
    </div>
  </div>

  </main>
</div>

  <div id="uploadProgress" class="upload-progress hidden"></div>

  <div id="toast" class="toast"></div>

  <!-- Prompt modal (rename / new folder) -->
  <div id="promptModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span id="promptTitle">Input</span>
        <button class="modal-close" id="promptClose" aria-label="Close">&times;</button>
      </div>
      <input type="text" id="promptInput" class="text-input">
      <div class="modal-footer">
        <div class="modal-footer-actions">
          <button class="btn btn-ghost" id="promptCancel">Cancel</button>
          <button class="btn btn-primary" id="promptOk">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm modal (delete) -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span id="confirmTitle">Are you sure?</span>
        <button class="modal-close" id="confirmClose" aria-label="Close">&times;</button>
      </div>
      <p id="confirmBody" class="confirm-body"></p>
      <div class="modal-footer">
        <div class="modal-footer-actions">
          <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
          <button class="btn btn-danger-solid" id="confirmOk">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
